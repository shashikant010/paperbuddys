  <style>
    body {
      background-color: #050505; /* Prevents white flash before Flutter loads */
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .loading-text {
      color: #00F0FF; /* Neon Cyan */
      font-family: 'Space Mono', monospace, sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-text">INITIALIZING SYSTEM...</div>

  <script>
    // Remove the loading text once Flutter starts rendering
    window.addEventListener('load', function(ev) {
      // Small delay to ensure Flutter canvas has taken over
      setTimeout(function() {
        var loadingElement = document.getElementById('loading');
        if(loadingElement) {
          loadingElement.remove();
        }
      }, 2000);
    });
  </script>

  <div style="position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; z-index: -9999; pointer-events: none;">
      
      <div 
          class="apply-button" 
          data-hackathon-slug="smart-school-fintech-innovation-challenge" 
          data-button-theme="light"
          style="height: 44px; width: 312px"
      ></div>

      <img src="https://devfolio.co/logo.png" alt="DEVFOLIO LOGO">

  </div>

  <script defer async src="https://apply.devfolio.co/v2/sdk.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
