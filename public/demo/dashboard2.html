<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Buddy - Home Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="mesh-gradient-bg"></div>
    
    <canvas id="bg-sparkline" class="background-canvas"></canvas>

    <div class="dashboard-wrapper">
        
        <div class="app-mockup-section staggered-entry">
            <div class="phone-frame glassmorphic floating-animation">
                <div class="phone-screen shimmering-animation">
                    <div class="app-dashboard-screen">
                        <div class="app-header">
                            <img src="assets/avatar.png" alt="User" class="app-avatar-placeholder">
                            <div>
                                <h4>Hi, Alex</h4>
                                <p>Ready for class?</p>
                            </div>
                        </div>
                        <div class="app-widget app-attendance">
                            <span>Attendance</span>
                            <div class="progress-bar-mini"><div class="progress-fill" style="width: 85%;"></div></div>
                        </div>
                        <div class="app-widget app-actions">
                            <div class="action-btn"><i class="fas fa-qrcode"></i></div>
                            <div class="action-btn"><i class="fas fa-bus"></i></div>
                            <div class="action-btn"><i class="fas fa-calendar"></i></div>
                        </div>
                    </div>
                </div>
                <div class="phone-speaker"></div>
                <div class="phone-button"></div>
            </div>
        </div>

        <div class="bento-grid-section staggered-entry" style="animation-delay: 0.3s;">
            
            <div class="bento-box glassmorphic greeting-box">
                <div class="greeting-content">
                    <h2>Welcome to your Hub</h2>
                    <p>Everything you need for your day, beautifully organized.</p>
                </div>
                <i class="fas fa-layer-group bento-icon-bg"></i>
            </div>

            <div class="bento-box glassmorphic tracking-box">
                <div class="box-header">
                    <h3><i class="fas fa-check-circle"></i> Live Attendance</h3>
                </div>
                <div class="circular-progress-container">
                    <svg class="circular-progress" viewBox="0 0 100 100">
                        <circle class="bg" cx="50" cy="50" r="40"></circle>
                        <circle class="progress" cx="50" cy="50" r="40" style="stroke-dashoffset: 60;"></circle>
                    </svg>
                    <div class="progress-text">85%</div>
                </div>
            </div>

            <div class="bento-box glassmorphic transit-box">
                <div class="box-header">
                    <h3><i class="fas fa-location-arrow"></i> Transit</h3>
                </div>
                <div class="transit-visual">
                    <div class="route-line"></div>
                    <div class="bus-dot pulsing-dot"></div>
                    <div class="stop-dot"></div>
                </div>
                <p class="transit-status">Campus Shuttle - 3 mins away</p>
            </div>

            <div class="bento-box glassmorphic analytics-box">
                <div class="box-header">
                    <h3><i class="fas fa-chart-line"></i> Weekly Activity</h3>
                </div>
                <canvas id="mini-sparkline" class="bento-canvas"></canvas>
            </div>

        </div>
    </div>

    <div class="nav-buttons-container staggered-entry" style="animation-delay: 0.6s;">
        <a href="index.html" class="nav-btn glass-btn reflection-effect">
            <i class="fas fa-arrow-left"></i> Previous Page: Login
        </a>
        <a href="profile.html" class="nav-btn glass-btn reflection-effect pulsing-glass">
            Next Page: View Profile <i class="fas fa-arrow-right"></i>
        </a>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
